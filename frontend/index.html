<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DDR Report Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --error: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            width: 100%;
            max-width: 500px;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
            text-align: center;
        }

        p.subtitle {
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 24px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="file"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="file"]:focus,
        input[type="password"]:focus {
            border-color: var(--primary);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: var(--text-muted);
            cursor: not-allowed;
        }

        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #error-message {
            color: var(--error);
            background-color: #fef2f2;
            border: 1px solid #fca5a5;
            padding: 12px;
            border-radius: 6px;
            margin-top: 20px;
            display: none;
            font-size: 14px;
        }

        #success-message {
            color: #059669;
            background-color: #ecfdf5;
            border: 1px solid #6ee7b7;
            padding: 12px;
            border-radius: 6px;
            margin-top: 20px;
            display: none;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>DDR Report Generator</h1>
        <p class="subtitle">Upload your inspection and thermal reports below to generate a formatted DOCX report.</p>

        <form id="reportForm">
            <div class="form-group">
                <label for="inspectionReport">Inspection Report (PDF)</label>
                <input type="file" id="inspectionReport" accept="application/pdf" required>
            </div>

            <div class="form-group">
                <label for="thermalReport">Thermal Report (PDF)</label>
                <input type="file" id="thermalReport" accept="application/pdf" required>
            </div>

            <button type="submit" id="generateBtn">
                <div class="spinner" id="spinner"></div>
                <span>Generate Report</span>
            </button>
        </form>

        <div id="error-message"></div>
        <div id="success-message">Report generated successfully! Download will begin automatically.</div>
    </div>

    <script>
        const form = document.getElementById('reportForm');
        const btn = document.getElementById('generateBtn');
        const spinner = document.getElementById('spinner');
        const errorDiv = document.getElementById('error-message');
        const successDiv = document.getElementById('success-message');
        const btnText = btn.querySelector('span');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Reset state
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            btn.disabled = true;
            spinner.style.display = 'block';
            btnText.textContent = 'Processing...';

            const formData = new FormData();
            formData.append('inspection_report', document.getElementById('inspectionReport').files[0]);
            formData.append('thermal_report', document.getElementById('thermalReport').files[0]);

            try {
                const response = await fetch('/generate', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || 'An unknown error occurred');
                }

                // Handle file download
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'DDR_Report.docx';
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);

                successDiv.style.display = 'block';
            } catch (err) {
                errorDiv.textContent = err.message;
                errorDiv.style.display = 'block';
            } finally {
                btn.disabled = false;
                spinner.style.display = 'none';
                btnText.textContent = 'Generate Report';
            }
        });
    </script>
</body>

</html>
